spring.application.name=notification-service
server.port=8082

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages="com.ciberaccion.*"

# El productor no manda headers con el nombre de clase (ver KafkaProducerConfig en order-service),
# así que le decimos explícitamente a este consumer a qué clase deserializar el payload.
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.ciberaccion.notificationservice.event.OrderCreatedEvent

app.kafka.topic.order-events=order-events
logging.level.org.apache.kafka=WARN